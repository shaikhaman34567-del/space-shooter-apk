name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        # Graphics aur SDL2 compile karne ke liye saare advanced tools jod diye hain
        sudo apt-get install -y build-essential ccache git zlib1g-dev libssl-dev libffi-dev libsqlite3-dev libbz2-dev libreadline-dev libgdbm-dev libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev liblzma-dev zip unzip autoconf automake libtool pkg-config cmake patch openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Space-Shooter-APK
        path: bin/*.apk
