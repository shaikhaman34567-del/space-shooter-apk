name: Build Android APK

on:
  workflow_dispatch: # Isse button dabane par build shuru hogi

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev gdbm-tools liblzma-dev libreadline-dev uuid-dev libffi-dev tk-dev libgmp3-dev libmpfr-dev libmpc-dev android-tools-adb
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        # Yeh aapki game.py file ko lekar seedha APK banayega
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Space-Shooter-APK
        path: bin/*.apk
